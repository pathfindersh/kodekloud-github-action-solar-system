name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
    MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData #added
    MONGO_USERNAME: superuser #added
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }} #added and secret is stored in secret place in github . 
    
jobs:
    unit-testing:
      name: Unit Testing
      runs-on: ubuntu-latest
      container: #added
        image: 'node:20' #added
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
      #- name: Setup NodeJS Version #commented
      #  uses: actions/setup-node@v3 #commented
      #  with: #commented
      #    node-version: 20 #commented
        - name: Cache NPM dependencies
          uses: actions/cache@v3
          with:
            path: ~/.npm
            key: "${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}"
        - name: Install Dependencies
          run: npm install
        - name: Unit Testing
          run: npm test
        - name: Archive Test Result
          uses: actions/upload-artifact@v3
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 18
        - run: npm install
        - continue-on-error: true
          run: npm run coverage
        - uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5  

    docker:
      needs:
      - code-coverage
      - unit-testing
      permissions: #added
        packages: write #added
      runs-on: ubuntu-latest
      
      steps:
        - uses: actions/checkout@v4
        - uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: '${{ github.repository_owner }}'
            password: '${{ secrets.GITHUB_TOKEN }}'
        - uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: 'ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}'


    dev-deploy:
      # needs: docker
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Install kubectl CLI
          uses: azure/setup-kubectl@v3
          with:
            version: 'v1.26.0'

        - name: Set Kubeconfig file
          uses: azure/k8s-set-context@v3
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBECONFIG }}

        - name: Fetch Kubernetes Cluster Details
          run: |
            kubectl version -- short
            echo -----------------------------------------
            kubectl get nodes
